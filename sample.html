<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reordering with CSS</title>
    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .item {
            width: calc(33.33% - 10px); /* 3 items per row on desktop */
            padding: 20px;
            background-color: lightblue;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        /* Mobile: Make it 1 column and reorder items */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .item:nth-child(1) { order: 1; } /* 1 */
            .item:nth-child(2) { order: 2; } /* 2 */
            .item:nth-child(3) { order: 3; } /* 3 */
            .item:nth-child(4) { order: 6; } /* 6 moves up */
            .item:nth-child(5) { order: 5; } /* 5 */
            .item:nth-child(6) { order: 4; } /* 4 moves last */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

</body>
</html>
